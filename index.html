<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>多樂桌遊產品資訊連結系統</title>
  <meta
    name="description"
    content="多樂桌遊產品資訊連結系統，可搜尋產品、使用下拉選單或點擊產品圖片前往產品介紹頁。"
  >

  <!-- V5: 讓瀏覽器在執行 JavaScript 前發現首頁 LCP 縮圖。 -->
  <link rel="preload" as="image" href="images/thumbs/AS001.webp" fetchpriority="high">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a class="skip-link" href="#mainContent">跳到主要內容</a>

  <!-- 固定頂部搜尋區 -->
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-area">
        <a class="brand-link" href="index.html" aria-label="回到首頁">
          <span class="brand-icon" aria-hidden="true">🎲</span>
          <span class="brand-text">多樂桌遊產品資訊</span>
        </a>
      </div>

      <div class="search-area">
        <label class="sr-only" for="searchInput">搜尋產品名稱</label>

        <div class="search-box">
          <span class="search-icon" aria-hidden="true">🔍</span>

          <input
            type="search"
            id="searchInput"
            name="search"
            placeholder="搜尋產品名稱……"
            autocomplete="off"
            enterkeyhint="search"
            aria-controls="productGrid"
          >

          <button
            type="button"
            id="clearSearchBtn"
            class="clear-search-button"
            aria-label="清除搜尋內容"
            hidden
          >
            ×
          </button>
        </div>
      </div>
    </div>
  </header>

  <main id="mainContent" class="main-content">
    <!-- 首頁標題 -->
    <section class="hero-section" aria-labelledby="pageTitle">
      <p class="eyebrow">DORA BOARD GAMES</p>
      <h1 id="pageTitle">多樂桌遊產品資訊連結系統</h1>
      <p class="hero-description">
        可透過搜尋、下拉選單或產品圖片，快速查看產品介紹、說明書與教學影片。
      </p>
    </section>

    <!-- 下拉選單 -->
    <section class="selector-section panel" aria-labelledby="selectorTitle">
      <div class="section-heading">
        <div>
          <p class="section-kicker">快速前往</p>
          <h2 id="selectorTitle">使用下拉選單選擇產品</h2>
        </div>
      </div>

      <div class="product-selector">
        <label for="productSelect">產品名稱</label>

        <div class="selector-controls">
          <select id="productSelect">
            <option value="">載入產品中……</option>
          </select>

          <button type="button" id="goProductBtn" class="primary-button">
            前往產品頁
          </button>
        </div>
      </div>
    </section>

    <!-- 搜尋狀態 -->
    <section
      id="searchStatusSection"
      class="search-status-section"
      aria-live="polite"
      aria-atomic="true"
    >
      <p id="searchStatus" class="search-status"></p>
    </section>

    <!-- 所有產品 -->
    <section class="products-section" aria-labelledby="productsTitle">
      <div class="section-heading products-heading">
        <div>
          <p class="section-kicker">PRODUCTS</p>
          <h2 id="productsTitle">全部產品</h2>
        </div>

        <p id="productCount" class="product-count"></p>
      </div>

      <div
        id="productGrid"
        class="product-grid"
        aria-live="polite"
        aria-busy="true"
      >
        <!-- 產品卡片將由 script.js 自動建立 -->
      </div>

      <div id="emptyState" class="empty-state" hidden>
        <div class="empty-state-icon" aria-hidden="true">🔎</div>
        <h3>找不到符合的產品</h3>
        <p>請嘗試輸入其他產品名稱或清除搜尋條件。</p>
        <button type="button" id="resetSearchBtn" class="secondary-button">
          顯示全部產品
        </button>
      </div>
    </section>
  </main>

  <!-- 頁尾 -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p>© <span id="currentYear"></span> 多樂桌遊</p>
      <p>產品資訊與連結以各產品頁內容為準。</p>
    </div>
  </footer>

  <!-- 回到頂端 -->
  <button
    type="button"
    id="backToTopBtn"
    class="back-to-top-button"
    aria-label="回到頁面頂端"
    title="回到頂端"
    hidden
  >
    ↑
  </button>

  <!--
    載入順序不可互換：
    1. products.js 提供產品資料
    2. script.js 使用產品資料建立首頁內容
  -->
  <script src="products.js" defer></script>
  <script src="script.js" defer></script>
</body>
</html>
